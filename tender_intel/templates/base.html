<!doctype html>
<html lang="en">
<head>

  <title>{% block title %}Skystar Tender Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">Skystar Tender Intelligence</div>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>

    Skystar Holdings Limited -- prototype tender intelligence &amp; proposal-response tool.
