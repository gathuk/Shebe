{% extends "base.html" %}
{% block title %}Departments - NetLimit{% endblock %}
{% block content %}
<h1>Departments</h1>

<table>
  <tr><th>Name</th><th>Headcount</th><th>Daily time quota</th><th>Daily data quota</th><th></th></tr>
  {% for dept in departments %}
  <tr>
    <td>{{ dept.name }}</td>
    <td>{{ headcounts[dept.id] }}</td>
    <td>
      <form class="inline" method="post" action="{{ url_for('edit_department', department_id=dept.id) }}">
        <input type="number" name="daily_time_quota_minutes" value="{{ dept.daily_time_quota_minutes }}" style="width:80px"> min
    </td>
    <td>
        <input type="number" name="daily_data_quota_mb" value="{{ dept.daily_data_quota_mb }}" style="width:90px"> MB
    </td>
    <td><button type="submit">Save</button></form></td>
  </tr>
  {% endfor %}
</table>

<h2>Add department</h2>
<form class="form-row" method="post">
  <input type="text" name="name" placeholder="Department name" required>
  <input type="number" name="daily_time_quota_minutes" placeholder="Time quota (min)" value="120">
  <input type="number" name="daily_data_quota_mb" placeholder="Data quota (MB)" value="2048">
  <button type="submit">Add</button>
</form>
{% endblock %}
